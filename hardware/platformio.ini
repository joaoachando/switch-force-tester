[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0

# PlatformIO will auto-download these libraries when you compile!
lib_deps =
	laurb9/StepperDriver@^1.1.4
	bogde/HX711@^0.7.5
	mathertel/RotaryEncoder@^1.5.3
	waspinator/AccelStepper@^1.64
