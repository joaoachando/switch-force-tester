<style>
    .icon{
        height: 65px;
    }

    body{
        display:flex;
        flex-wrap: nowrap;
        flex-direction: column;
        margin:0;
        padding:0;
        min-height: 100vh;
        background: #3e3e3e;
        justify-content: center;
        align-items: center;
    }
    .container{
        width: 1200px;
        display: flex;
        justify-content: space-between;
        flex-wrap:nowrap;
        margin: 20px;
    }

    .container .card{
        position: relative;
    }

    .container .card .face{
        width: 200px;
        height: 200px;
        transition:.4s;
    }

    .container .card .face.face1{
        position: relative;
        background: #333333;
        border-radius: 25px;
        display: flex;
        justify-content: center;
        align-content:center;
        align-items: center;
        z-index: 1;
        box-sizing: border-box;
        box-shadow: 0 20px 50px rgba(0,0,0,.6);
    }

    .container .card:hover .face.face1{
        border-radius: 25px 25px 25px 25px;
        box-shadow:
                inset 0 0 60px #e6e6e6,
                inset 20px 0 80px #ff00ff,
                inset -20px 0 80px #00ffff,
                inset 20px 0 300px #ff00ff,
                inset -20px 0 300px #00ffff,
                0 0 10px #e6e6e6,
                -10px 0 45px #ff00ff,
                10px 0 45px #00ffff;
    }


    .container .card .face.face1 .content{
        opacity: .2;
        transition:  0.5s;
        text-align: center;
    }

    .container .card:hover .face.face1 .content{
        opacity: 1;
    }

    .container .card .face.face1 .content h3{
        font-size: 1em;
        color: white;
    }
</style>
